<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You | HopeBridge Donations</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="success-wrapper">
      <div class="success-card">
        <span class="eyebrow">Thank you</span>
        <h1>Your generosity is making a difference.</h1>
        <p>We received your form submission and appreciate your support. Online payments are not processed through this website.</p>

        <div class="success-summary" id="donationSummary"></div>

        <a href="index.html" class="back-btn">Back to donation page</a>
      </div>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const summaryEl = document.getElementById('donationSummary');
      const details = [
        ['Name', params.get('name') || 'Donor'],
        ['Email', params.get('email') || 'N/A'],
        ['Donation', `₹${params.get('amount') || '0'}`],
        ['Type', params.get('type') || 'One-time']
      ];
      const message = params.get('message');
      if (message) details.push(['Message', message]);

      details.forEach(([label, value]) => {
        const row = document.createElement('p');
        const heading = document.createElement('strong');
        heading.textContent = `${label}:`;
        row.append(heading, ` ${value}`);
        summaryEl.append(row);
      });
    </script>
  </body>
</html>
