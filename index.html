<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avighna Donation</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="script.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <div class="brand">Avighna 2007-2026</div>
        <nav>
          <a href="#impact">Impact</a>
          <a href="#stories">Stories</a>
          <a href="#support">Support</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="container hero-inner">
          <div class="hero-copy">
            <span class="eyebrow">Ganesh Maharaj</span>
            <h1>MCH Colony.</h1>
            <p>
              Donation for Ganesh Chaturthi Celebration.
            </p>


            <form id="donationForm" novalidate>
              <div class="form-group">
                <label for="donorName">Full name</label>
                <input type="text" id="donorName" placeholder="Enter your name" required />
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label for="donorEmail">Email</label>
                  <input type="email" id="donorEmail" placeholder="you@example.com" required />
                </div>
                <div class="form-group">
                  <label for="donorPhone">Phone</label>
                  <input type="tel" id="donorPhone" placeholder="+91 XXXXX XXXXX" required />
                </div>
              </div>

              <div class="form-group">
                <label>Quick amount</label>
                <div class="preset-amounts">
                  <button type="button" class="amount-chip" data-amount="250">₹250</button>
                  <button type="button" class="amount-chip" data-amount="500">₹500</button>
                  <button type="button" class="amount-chip" data-amount="1000">₹1000</button>
                  <button type="button" class="amount-chip" data-amount="2500">₹2500</button>
                </div>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label for="donationAmount">Donation amount</label>
                  <input type="number" id="donationAmount" placeholder="500" min="1" required />
                </div>
                <div class="form-group">
                  <label for="donationType">Donation type</label>
                  <select id="donationType">
                    <option value="One-time">One-time</option>
                    <option value="Monthly">Monthly</option>
                  </select>
                </div>
              </div>

             
              <div class="form-group">
                <label for="message">Message (optional)</label>
                <textarea id="message" rows="3" placeholder="Leave a note of encouragement or purpose"></textarea>
              </div>

              <button type="submit" class="donate-btn">Donate now</button>
            </form>
          </div>
        </div>
      </section>
