trigger:
  - main

pool:
  name: default

variables:
  - group: swa-deployment

steps:
  - powershell: |
      $files = @('index.html', 'style.css', 'script.js', 'success.html')
      foreach ($file in $files) {
        if (-not (Test-Path $file)) {
          throw "Required site file missing: $file"
        }
      }
    displayName: Validate static site files

  - task: AzureStaticWebApp@0
    inputs:
      app_location: '/'
      api_location: ''
      output_location: ''
      skip_app_build: true
      azure_static_web_apps_api_token: $(deployment_token)