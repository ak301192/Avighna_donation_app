trigger:
  - main

pool:
  name: default

variables:
  - group: swa-deployment

steps:
  - powershell: |
      if ([string]::IsNullOrWhiteSpace($env:SWA_CLI_DEPLOYMENT_TOKEN) -or
          $env:SWA_CLI_DEPLOYMENT_TOKEN -match '^\$\(.+\)$') {
        Write-Error "Deployment token is missing or unresolved."
        exit 1
      }
      Write-Host "Deployment token is present (value hidden)."
    displayName: "Check SWA token is available"
    env:
      SWA_CLI_DEPLOYMENT_TOKEN: $(deployment_token)

  - powershell: |
      $files = @('index.html', 'style.css', 'script.js', 'success.html')
      foreach ($file in $files) {
        if (-not (Test-Path $file)) {
          throw "Required site file missing: $file"
        }
      }
    displayName: Validate static site files

  - powershell: |
      $client = Get-ChildItem (Join-Path $env:USERPROFILE '.swa\deploy') `
        -Filter 'StaticSitesClient.exe' -Recurse -ErrorAction SilentlyContinue |
        Sort-Object LastWriteTime -Descending |
        Select-Object -First 1 -ExpandProperty FullName

      if (-not $client) {
        throw "StaticSitesClient.exe was not found in the user's SWA cache."
      }

      $env:DEPLOYMENT_ACTION = 'upload'
      $env:DEPLOYMENT_PROVIDER = 'SwaCli'
      $env:REPOSITORY_BASE = $env:BUILD_SOURCESDIRECTORY
      $env:APP_LOCATION = '.'
      $env:SKIP_APP_BUILD = 'true'
      $env:SKIP_API_BUILD = 'true'
      $env:DEPLOYMENT_TOKEN = $env:SWA_CLI_DEPLOYMENT_TOKEN.Trim()
      $env:VERBOSE = 'false'
      $env:FUNCTION_LANGUAGE = 'node'
      $env:FUNCTION_LANGUAGE_VERSION = '22'

      & $client
      if ($LASTEXITCODE -ne 0) {
        exit $LASTEXITCODE
      }
    displayName: Diagnose Static Web Apps deployment
    env:
      SWA_CLI_DEPLOYMENT_TOKEN: $(deployment_token)