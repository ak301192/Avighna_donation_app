version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - npm ci
  build:
    commands:
      - node --check server.js
      - node --check script.js

artifacts:
  files:
    - index.html
    - success.html
    - style.css
    - script.js
    - server.js
    - package.json
    - package-lock.json
    - ganesh-chaturthi-background.jpeg
